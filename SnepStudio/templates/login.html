{% extends "base.html" %}

{% block title %}Client Login - SnepStudio{% endblock %}

{% block content %}
<div class="container">
  <div class="card form-auth">
    <div class="card-header text-center" style="text-align: center;">
      <h2 class="card-title">Client Portal Login</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px;">
        Access your booked appointments and editing progress
      </p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Sign In to Portal
      </button>

      <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? <a href="{{ url_for('register') }}" style="font-weight: 600;">Register here</a>
      </div>

      <div style="text-align: center; margin-top: 15px; font-size: 0.85rem; border-top: 1px solid var(--border-color); padding-top: 15px;">
        Are you an administrator? <a href="{{ url_for('admin_login') }}">Admin Login &rarr;</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
